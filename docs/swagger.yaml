  /firmaperu/documentos/{uuid}:
    get:
      description: URL interna usada por el Firmador (documentToSign) para descargar
        el documento que será firmado. Requiere el UUID devuelto en POST /firmaperu/firmar.
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Documento original
          schema:
            type: file
        "404":
          description: Documento no encontrado
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Descarga el documento original por firmar
      tags:
      - FirmaPeru
    post:
      consumes:
      - multipart/form-data
      description: URL interna a la que el Firmador (uploadDocumentSigned) devuelve
        el documento firmado. Acepta el archivo como multipart (campo file) o como
        cuerpo plano.
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      - description: Documento firmado (multipart)
        in: formData
        name: file
        type: file
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpadapter.apiResponse'
        "400":
          description: Documento vacío o inválido
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "404":
          description: Proceso de firma no encontrado
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Recibe el documento firmado del Firmador
      tags:
      - FirmaPeru
  /firmaperu/documentos/{uuid}/firmado:
    get:
      description: Devuelve el documento ya firmado (PAdES/XAdES/CAdES) o 404 si el
        Firmador aún no lo subió.
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Documento firmado
          schema:
            type: file
        "404":
          description: Documento no disponible aún o no encontrado
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Descarga el documento firmado
      tags:
      - FirmaPeru
  /firmaperu/documentos/{uuid}/lote:
    get:
      description: 'URL interna usada por el Firmador en modo lote (documentToSign):
        descarga un archivo 7z con todos los documentos del lote por firmar.'
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
