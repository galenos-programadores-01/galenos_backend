      summary: Descarga el 7z con los documentos del lote
      tags:
      - FirmaPeru
    post:
      consumes:
      - multipart/form-data
      description: URL interna a la que el Firmador (uploadDocumentSigned) devuelve
        el 7z con los documentos firmados del lote. Acepta el archivo como multipart
