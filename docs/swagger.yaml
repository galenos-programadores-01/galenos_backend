      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      - description: Archivo 7z con los documentos firmados (multipart)
        in: formData
        name: signed_file
        type: file
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpadapter.apiResponse'
        "400":
          description: Archivo vacío o inválido
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "404":
          description: Lote no encontrado
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Recibe el 7z firmado del lote
      tags:
      - FirmaPeru
  /firmaperu/documentos/{uuid}/lote/firmado:
    get:
      description: Devuelve el archivo 7z con los documentos ya firmados del lote
        o 404 si el Firmador aún no lo subió.
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Archivo 7z firmado
          schema:
            type: file
        "404":
          description: Lote no disponible aún
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Descarga el 7z firmado del lote
      tags:
      - FirmaPeru
  /firmaperu/firmar:
    post:
      consumes:
      - multipart/form-data
      description: Almacena el documento por firmar y devuelve la cadena base64 que
        el frontend debe pasar a startSignature(port, param) de firmaperu.min.js.
        El Firmador local descargará el documento (documentToSign), el usuario firmará
        con su DNIe y devolverá el firmado a uploadDocumentSigned (ambas URLs internas
        al param).
      parameters:
      - description: Documento a firmar (PDF para PAdES, XML para XAdES, cualquier
          archivo para CAdES)
        in: formData
        name: document
        required: true
        type: file
      - description: Imagen PNG (base64 o data-URL) del estampado visible de la firma;
          por defecto se usa el logo por omisión
        in: formData
        name: imageEstampado
        type: string
      - description: 'Formato de firma: PAdES (default) | XAdES | CAdES'
        in: formData
        name: signatureFormat
        type: string
      - description: 'Nivel de firma: B (default) | T | LTA'
        in: formData
        name: signatureLevel
        type: string
      - description: 'Empaquetado: enveloped (default) | enveloping | detached | internallydetached'
        in: formData
        name: signaturePackaging
        type: string
      - description: URL del servicio de sello de tiempo TSA (obligatorio si signatureLevel=T/LTA)
        in: formData
        name: webTsa
        type: string
      - description: Usuario de la TSA
        in: formData
        name: userTsa
        type: string
      - description: Password de la TSA
        in: formData
        name: passwordTsa
        type: string
      - description: Identificador de la firma en el documento
        in: formData
        name: contactInfo
        type: string
      - description: Motivo de la firma
        in: formData
        name: signatureReason
        type: string
      - description: URL de la imagen PNG del estampado a usar en la firma visible
        in: formData
        name: imageToStamp
        type: string
      - description: 'Estilo de la representación gráfica: 0 sin representación, 1
          horizontal (default), 2 vertical, 3 solo estampado, 4 solo descripción'
        in: formData
        name: signatureStyle
        type: integer
      - description: Tamaño de fuente del estampado (default 14)
        in: formData
        name: stampTextSize
        type: integer
      - description: Ancho de línea del estampado (default 37)
        in: formData
        name: stampWordWrap
        type: integer
      - description: Página donde se coloca la firma visible (default 1)
        in: formData
        name: stampPage
        type: integer
      - description: Posición horizontal de la firma
        in: formData
        name: positionx
        type: integer
      - description: Posición vertical de la firma
        in: formData
        name: positiony
        type: integer
      - description: Muestra el panel de posición de la firma en el Firmador (default
          false)
        in: formData
        name: visiblePosition
        type: boolean
      - description: Firma los documentos uno a uno (default false)
        in: formData
        name: oneByOne
        type: boolean
      - description: Rol del firmante
        in: formData
        name: role
        type: string
      - description: Firma de certificación (limita cambios posteriores)
        in: formData
        name: certificationSignature
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/httpadapter.firmaPeruInitResponse'
              type: object
        "400":
          description: Parámetros o documento inválidos
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "413":
          description: Documento excede el tamaño máximo
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "502":
          description: Error al obtener token o preparar el proceso
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Inicia un proceso de firma digital con el Firmador Web
      tags:
      - FirmaPeru
  /firmaperu/lote:
    post:
      consumes:
      - multipart/form-data
      description: Recibe múltiples documentos (campo 'document') y devuelve el param
        base64 para startSignature. El Firmador descargará un 7z con todos los documentos
        (documentToSign) y devolverá el 7z firmado (uploadDocumentSigned); el usuario
        firma todos con un solo PIN del DNIe.
      parameters:
      - description: Documentos a firmar (repetir el campo por cada PDF)
        in: formData
        name: document
        required: true
        type: file
      - description: Imagen PNG (base64 o data-URL) del estampado visible de la firma
        in: formData
        name: imageEstampado
        type: string
      - description: 'Formato de firma: PAdES (default)'
        in: formData
        name: signatureFormat
        type: string
      - description: 'Nivel de firma: B (default) | T | LTA'
        in: formData
        name: signatureLevel
        type: string
      - description: Motivo de la firma
        in: formData
        name: signatureReason
        type: string
      - description: Estilo de la representación gráfica (default 1)
        in: formData
        name: signatureStyle
        type: integer
      - description: Tamaño de fuente del estampado (default 14)
        in: formData
        name: stampTextSize
        type: integer
      - description: Ancho de línea del estampado (default 37)
        in: formData
        name: stampWordWrap
        type: integer
      - description: Página donde se coloca la firma visible (default 1)
        in: formData
        name: stampPage
        type: integer
      - description: Posición horizontal de la firma
        in: formData
        name: positionx
        type: integer
      - description: Posición vertical de la firma
        in: formData
        name: positiony
        type: integer
      - description: Rol del firmante
        in: formData
        name: role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/httpadapter.firmaPeruInitResponse'
              type: object
        "400":
          description: Parámetros o documentos inválidos
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "413":
          description: Documento excede el tamaño máximo
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "502":
          description: Error al obtener token o preparar el lote
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Inicia una firma por lote (varios documentos, un solo PIN)
      tags:
      - FirmaPeru
  /firmaperu/params/{uuid}:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 'Endpoint interno expuesto en param_url del wrapper: el Firmador
        local lo llama (form-urlencoded) con el param_token de un solo uso y responde
        con el JSON base64 de los parámetros de firma (documentToSign, uploadDocumentSigned,
        token, etc.).'
      parameters:
      - description: UUID del proceso de firma
        in: path
        name: uuid
        required: true
        type: string
      - description: Token de un único uso entregado en el wrapper
        in: formData
        name: param_token
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: JSON base64 con los parámetros de firma
          schema:
            type: string
        "400":
          description: param_token inválido
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "404":
          description: Proceso de firma no encontrado
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
        "502":
          description: Error al obtener el token de la plataforma
          schema:
            allOf:
            - $ref: '#/definitions/httpadapter.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/httpadapter.apiError'
              type: object
      summary: Devuelve los parámetros de firma al Firmador local
      tags:
      - FirmaPeru
